# Integración continua con moodle-plugin-ci (la misma batería de
# comprobaciones que pasa el equipo de revisión de moodle.org).
name: Moodle Plugin CI

# Disparadores (presupuesto de Actions, 04-10-2026):
#  - push a una rama: solo la entrada «quick» de la matriz (8.3 + 5.2 + MariaDB, con Behat);
#    si el commit empieza por «release », no corre nada (la etiqueta lanza la matriz completa);
#  - push de una etiqueta v*, pull request o lanzamiento manual: la matriz completa;
#  - cambios solo en docs/ o en ficheros .md no lanzan nada.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# Un push nuevo a la misma rama cancela el run anterior todavía en marcha.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Elige qué entradas de la matriz corren (GitHub no deja leer `matrix` en el `if` de un job):
  # push de rama = solo la entrada quick; etiqueta, pull request o manual = todas.
  # Un push de rama cuyo commit empieza por «release » no corre nada: su etiqueta ya lo hace.
  prepare:
    runs-on: ubuntu-22.04
    if: >-
      ${{ !(github.event_name == 'push' && github.ref_type == 'branch'
            && startsWith(github.event.head_commit.message, 'release ')) }}
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          FULL: '[{"php":"8.2","moodle-branch":"MOODLE_501_STABLE"},{"php":"8.3","moodle-branch":"MOODLE_502_STABLE","quick":true,"behat":true},{"php":"8.3","moodle-branch":"MOODLE_502_STABLE","db":"pgsql"},{"php":"8.3","moodle-branch":"MOODLE_503_STABLE","mariadb":"11.4"}]'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "include=$(echo "$FULL" | jq -c '[.[] | select(.quick == true)]')" >> "$GITHUB_OUTPUT"
          else
            echo "include=$(echo "$FULL" | jq -c .)" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: prepare
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental || false }}

    services:
      mariadb:
        # 5.3 exige MariaDB 11.4: la entrada MOODLE_503_STABLE de la matriz la pide; el resto sigue en 10.11.
        image: mariadb:${{ matrix.mariadb || '10.11' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.include) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, gd, zip, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.db || 'mariadb' }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker (phpcs)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --fail-on-skipped

      - name: Behat features
        if: ${{ !cancelled() && matrix.behat }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 2
